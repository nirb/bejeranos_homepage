<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Home</title>
  <style>
    /* Remove default margins/padding and prevent scrollbars */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* Keep the full image visible on all screens without cropping */
    picture {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    picture img {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100dvh;
      object-fit: contain;
      object-position: center;
      display: block;
    }
  </style>
</head>
<body>

  <picture>
    <!-- Screen is taller than wide (Portrait / Mobile) -->
    <source media="(orientation: portrait)" srcset="homepage-portrait.jpeg">

    <!-- Fallback & Landscape / Desktop (wider than tall) -->
    <img src="homepage-landscape.jpeg" alt="A Journey Through Tech, Growth, and New Chapters" fetchpriority="high">
  </picture>

</body>
</html>

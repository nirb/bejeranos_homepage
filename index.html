<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <style>
    /* Remove default margins/padding and prevent scrollbars */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000; /* Fallback color while loading */
    }

    /* Force the picture element and image to cover the entire screen */
    picture, 
    picture img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      /* dvh handles mobile address bar heights correctly */
      height: 100dvh; 
      object-fit: cover;
      object-position: center;
      display: block;
    }
  </style>
</head>
<body>

  <picture>
    <!-- Screen is taller than wide (Portrait / Mobile) -->
    <source media="(orientation: portrait)" srcset="homepage-portrait.jpeg">

    <!-- Fallback & Landscape / Desktop (wider than tall) -->
    <img src="homepage-landscape.jpeg" alt="Fullscreen Background">
  </picture>

</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Outer metallic gold gradient -->
    <linearGradient id="goldOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="25%" stop-color="#EBB638"/>
      <stop offset="55%" stop-color="#B87B19"/>
      <stop offset="85%" stop-color="#E4AE30"/>
      <stop offset="100%" stop-color="#84500A"/>
    </linearGradient>

    <!-- Ring band side gradient -->
    <linearGradient id="goldBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8E550B"/>
      <stop offset="20%" stop-color="#EBB638"/>
      <stop offset="45%" stop-color="#FFF5B8"/>
      <stop offset="70%" stop-color="#D49420"/>
      <stop offset="100%" stop-color="#6E3D04"/>
    </linearGradient>

    <!-- Inner gold hole gradient -->
    <linearGradient id="goldInner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FDE88E"/>
      <stop offset="40%" stop-color="#B27415"/>
      <stop offset="100%" stop-color="#4E2B02"/>
    </linearGradient>

    <!-- Top rim bevel highlight -->
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F2BE3E"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#E8AF2E"/>
      <stop offset="100%" stop-color="#9C600E"/>
    </linearGradient>

    <!-- Drop shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Outer Ring Body (tilted perspective cylinder) -->
    <!-- Base / outer curve -->
    <path d="M 10,28 C 10,43 20,53 32,53 C 44,53 54,43 54,28 L 54,22 C 54,37 44,47 32,47 C 20,47 10,37 10,22 Z" fill="url(#goldBand)" />

    <!-- Inner ring wall (inside depth) -->
    <ellipse cx="32" cy="22" rx="15" ry="8" fill="url(#goldInner)" />

    <!-- Top rim face of the ring -->
    <path fill-rule="evenodd" d="M 32,13 C 44.15,13 54,17.03 54,22 C 54,26.97 44.15,31 32,31 C 19.85,31 10,26.97 10,22 C 10,17.03 19.85,13 32,13 Z M 32,16 C 40.28,16 47,18.69 47,22 C 47,25.31 40.28,28 32,28 C 23.72,28 17,25.31 17,22 C 17,18.69 23.72,16 32,16 Z" fill="url(#rimLight)" />

    <!-- High-gloss reflection sparkle on the rim -->
    <path d="M 20,17 Q 23,17.5 25,19 Q 22,18.5 20,17 Z" fill="#FFFFFF" opacity="0.9" />

    <!-- Sparkle star -->
    <polygon points="19,14 20.2,17.5 23.5,18 20.2,18.8 19,22 17.8,18.8 14.5,18 17.8,17.5" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="19" cy="18" r="1.2" fill="#FFFBE6"/>
  </g>
</svg>
